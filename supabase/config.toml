# Config mínima de Supabase CLI para desarrollo/pruebas locales.
# Suficiente para `supabase start` + `supabase db reset` (aplica supabase/migrations/*.sql).
# No se habilita ningún servicio más allá de lo necesario para correr las migraciones
# y las Server Actions/rutas que las consumen (Auth + Postgres + Storage + API REST).

project_id = "digital-planner"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

# Captura de correo local. Se llamaba [inbucket]; el CLI 2.x lo renombró a [local_smtp] y emite
# un WARN de deprecación en cada comando si se usa el nombre viejo. Desactivado: este blueprint
# no prueba el envío de correo (es un no-objetivo explícito).
[local_smtp]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
# ESTE ARCHIVO CONFIGURA SOLO LA SUPABASE LOCAL (`supabase start` / `supabase db reset`), que es
# donde corren `npm run test:integration` y el desarrollo. NO configura produccion: alla
# `enable_signup` vive en el panel de Supabase (Authentication -> Sign In / Providers) y NO lo
# cambia nada de este repositorio.
#
# Aca esta en true desde el paso 3 del spec (el alta publica de agencia, /registro): la pagina y sus
# pruebas necesitan que `/auth/v1/signup` responda en la instancia local, y una instancia local es
# de usar y tirar. El alta ya no reparte permisos -- `handle_new_user()` crea todo perfil como
# 'client' desde 0007 y la promocion a administrador pasa por `crear_mi_agencia()`
# (0011_alta_de_agencia.sql), que comprueba quien la pide.
#
# EN PRODUCCION SIGUE CERRADO, y abrirlo es una decision del dueno que va despues de su propia
# auditoria, no un paso de esta entrega. Mientras el panel diga false, /registro se dibuja pero el
# alta devuelve error: es el estado esperado.
enable_signup = true

[auth.email]
enable_signup = true
# Apagada SOLO en local, y no por descuido: [local_smtp] esta desactivado mas arriba, asi que no hay
# servidor de correo que entregue el enlace de confirmacion. Con esto en true, cada alta de prueba
# crea cuentas que no podrian iniciar sesion jamas y no habria correo que las rescatara.
# EN PRODUCCION ESTA ENCENDIDA y tiene que seguir asi: el correo es el unico de los seis campos del
# registro que queda PROBADO, y sin confirmacion cualquiera se da de alta con la direccion de otro.
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

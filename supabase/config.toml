# Config mínima de Supabase CLI para desarrollo/pruebas locales.
# Suficiente para `supabase start` + `supabase db reset` (aplica supabase/migrations/*.sql).
# No se habilita ningún servicio más allá de lo necesario para correr las migraciones
# y las Server Actions/rutas que las consumen (Auth + Postgres + Storage + API REST).

project_id = "digital-planner"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

# Captura de correo local. Se llamaba [inbucket]; el CLI 2.x lo renombró a [local_smtp] y emite
# un WARN de deprecación en cada comando si se usa el nombre viejo. Desactivado: este blueprint
# no prueba el envío de correo (es un no-objetivo explícito).
[local_smtp]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
# El producto es solo por invitacion (ver app/login/page.tsx): el alta la hace inviteUser con el
# service role, que no pasa por esta opcion. Dejarla en true no habilita ninguna funcion del
# producto y si abre el endpoint publico /auth/v1/signup. Espejo de lo que debe estar en el panel
# de Supabase en produccion; si aca dice false y alla true, manda el panel.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"
